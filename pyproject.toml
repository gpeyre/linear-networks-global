[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "linear-networks-global"
version = "0.1.0"
description = "Covariance geometry and training dynamics of two-layer linear networks"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Gabriel Peyre"}, {name = "Stephen Zhang"}]
dependencies = ["numpy>=1.26,<3", "scipy>=1.11,<2"]

[project.optional-dependencies]
figures = ["matplotlib>=3.8,<4", "threadpoolctl>=3.2,<4"]
notebooks = ["matplotlib>=3.8,<4", "jupyterlab>=4,<5", "nbclient>=0.10,<1", "ipykernel>=6,<8"]

[project.scripts]
linear-networks-figures = "linear_networks.experiments.reproduce:main"

[project.urls]
Repository = "https://github.com/gpeyre/linear-networks-global"
Documentation = "https://github.com/gpeyre/linear-networks-global/blob/main/code/API.md"

[tool.setuptools.packages.find]
where = ["code/src"]

[tool.setuptools.package-data]
linear_networks = ["py.typed"]
